<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>You're Offline · AccountGo</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background-color: #0b0f19;
        color: #f1f5f9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        text-align: center;
        padding: 1.5rem;
      }
      .card {
        max-width: 400px;
        width: 100%;
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 1.5rem;
        padding: 2.25rem 1.75rem;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      }
      .mark {
        width: 48px;
        height: 48px;
        margin: 0 auto 1.25rem;
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 700;
        margin: 0 0 0.5rem;
        color: #ffffff;
        letter-spacing: -0.02em;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
        font-size: 0.875rem;
        color: #94a3b8;
      }
      .meta {
        display: inline-block;
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        background: rgba(16, 185, 129, 0.1);
        border: 1px solid rgba(16, 185, 129, 0.2);
        color: #34d399;
        font-size: 0.75rem;
        font-family: ui-monospace, monospace;
        margin-bottom: 1.25rem;
      }
      button {
        cursor: pointer;
        border: none;
        border-radius: 0.75rem;
        padding: 0.75rem 1.75rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: #022c22;
        background: #10b981;
        transition: all 0.15s ease;
        box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
      }
      button:hover {
        background: #34d399;
      }
      button:active {
        transform: scale(0.98);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="/accountgo-mark.svg" alt="AccountGo" class="mark" />
      <div class="meta">PWA Offline Mode</div>
      <h1>Workspace Offline</h1>
      <p>AccountGo cannot reach the cloud accounting API right now. Please check your network connection and retry.</p>
      <button type="button" onclick="location.reload()">Retry Connection</button>
    </div>
  </body>
</html>
