<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Left Ascending Leg: Indigo to Cobalt -->
    <linearGradient id="legLeft" x1="0%" y1="100%" x2="50%" y2="0%">
      <stop offset="0%" stop-color="#1e40af" />
      <stop offset="40%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Right Descending Leg: Cyan to Deep Sapphire -->
    <linearGradient id="legRight" x1="50%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- Forward 'Go' Arrow & Ledger Beam: Electric Cyan to Vivid Emerald -->
    <linearGradient id="arrowGo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Subtle Glow for High-Tech Pop -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <g filter="url(#dropShadow)">
    <!-- Left Stem of "A" (Ascending Momentum) -->
    <path d="M 28 94 L 54 22 C 55.5 18 58.5 16 62 16 C 65.5 16 68.5 18 70 22 L 78 43 L 64 43 L 58 27 L 38 90 C 37 93 34 95 30.5 95 C 27.5 95 25 93 25 90.5 C 25 89.5 25.5 88.5 28 94 Z"
          fill="url(#legLeft)" />

    <!-- Right Stem of "A" (Descending Anchor) -->
    <path d="M 66 32 L 92 90 C 93.5 93 92.5 96 89.5 96 C 87 96 84.5 94.5 83.5 92 L 67 56 L 77 32 Z"
          fill="url(#legRight)" />

    <!-- The 'Go' Forward Speed Chevron & Accounting Ledger Bar -->
    <!-- Pierces through the 'A', extending forward to signify agility and velocity -->
    <path d="M 22 61 C 22 58.5 24 56.5 26.5 56.5 L 82 56.5 L 75 49 C 73.5 47.5 73.5 45 75 43.5 C 76.5 42 79 42 80.5 43.5 L 94.5 57.5 C 96 59 96 61.5 94.5 63 L 80.5 77 C 79 78.5 76.5 78.5 75 77 C 73.5 75.5 73.5 73 75 71.5 L 82 64.5 L 26.5 64.5 C 24 64.5 22 62.5 22 61 Z"
          fill="url(#arrowGo)"
          filter="url(#softGlow)" />

    <!-- Foundation Dot (Precision double-entry balance accent) -->
    <circle cx="94" cy="91" r="5" fill="#38bdf8" />
  </g>
</svg>