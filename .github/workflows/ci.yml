name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: Build API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore src/Api/Api.csproj

      - name: Build
        run: dotnet build src/Api/Api.csproj -c Release --no-restore

  web:
    name: Build Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: src/Web/pnpm-lock.yaml

      - name: Install
        working-directory: src/Web
        run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: src/Web
        run: pnpm run build

      - name: Test
        working-directory: src/Web
        run: pnpm test

  api-tests:
    name: API tests (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Backend tests
        run: dotnet test test/AccountGo.BackendTests/AccountGo.BackendTests.csproj -c Release

      - name: Services tests
        run: dotnet test test/AccountGo.ServicesTests/AccountGo.ServicesTests.csproj -c Release

  api-tests-postgres:
    name: API tests (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # One throwaway database per test; see test/AccountGo.BackendTests/PostgresTestDatabase.cs.
      ACCOUNTGO_TEST_POSTGRES: Host=localhost;Port=5432;Username=postgres;Password=postgres;Maximum Pool Size=5
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The roles a hosted Postgres (Supabase) has, so the Data API lockdown runs as it does there.
      - name: Create hosted API roles
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -c "CREATE ROLE anon NOLOGIN" -c "CREATE ROLE authenticated NOLOGIN"

      - name: Multi-tenancy and architecture tests
        run: >-
          dotnet test test/AccountGo.BackendTests/AccountGo.BackendTests.csproj -c Release
          --filter "FullyQualifiedName~MultiTenancyPhase3Tests|FullyQualifiedName~PostgresConnectionString|FullyQualifiedName~Architecture|FullyQualifiedName~WorkspaceOperatingPolicyMigrationRehearsal"
          -- xUnit.MaxParallelThreads=4

      # pg_dump refuses a server newer than itself; match the postgres:17 service for the backup rehearsal.
      - name: Install PostgreSQL 17 client tools
        run: sudo apt-get update && sudo apt-get install -y postgresql-client-17

      # Dedicated multi-connection policy races and the personal-workspace conversion rehearsal, on PostgreSQL.
      # The rehearsal drives scripts/personal-workspace-conversion.sh with psql, pg_dump and pg_restore.
      - name: Workspace policy races and conversion rehearsal
        run: >-
          dotnet test test/AccountGo.ServicesTests/AccountGo.ServicesTests.csproj -c Release
          --filter "FullyQualifiedName~WorkspacePolicyCoordinationRaceTests|FullyQualifiedName~PersonalWorkspaceConversionScriptTests"
          -- xUnit.MaxParallelThreads=4

  worker-tests:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Loads the .ts modules directly: needs Node with type stripping on by default.
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Test
        working-directory: src/Api
        run: npm test
