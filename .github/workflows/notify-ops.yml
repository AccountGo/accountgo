name: Notify ops to deploy

# Hosted production deploy runs in the private AccountGo/accountgo-ops repo.
# Requires repo secret OPS_DISPATCH_TOKEN (see accountgo-ops docs/SECRETS-SETUP.md).

on:
  push:
    branches:
      - main
    paths:
      - 'src/Api/**'
      - 'src/Core/**'
      - 'src/Dto/**'
      - 'src/Services/**'
      - 'src/Infrastructure/**'
      - 'src/src.ServiceDefaults/**'
      - 'src/Web/**'
      - '.github/workflows/notify-ops.yml'
  workflow_dispatch:
    inputs:
      component:
        description: Which component to deploy (api, web, or both)
        required: true
        default: both
        type: choice
        options:
          - both
          - api
          - web

concurrency:
  group: notify-ops-${{ github.sha }}
  cancel-in-progress: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.out.outputs.api }}
      web: ${{ steps.out.outputs.web }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          filters: |
            api:
              - 'src/Api/**'
              - 'src/Core/**'
              - 'src/Dto/**'
              - 'src/Services/**'
              - 'src/Infrastructure/**'
              - 'src/src.ServiceDefaults/**'
              - '.github/workflows/notify-ops.yml'
            web:
              - 'src/Web/**'
              - '.github/workflows/notify-ops.yml'

      - name: Set outputs
        id: out
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            c="${{ inputs.component }}"
            if [ "$c" = "api" ] || [ "$c" = "both" ]; then echo "api=true" >> "$GITHUB_OUTPUT"; else echo "api=false" >> "$GITHUB_OUTPUT"; fi
            if [ "$c" = "web" ] || [ "$c" = "both" ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi
          else
            echo "api=${{ steps.filter.outputs.api }}" >> "$GITHUB_OUTPUT"
            echo "web=${{ steps.filter.outputs.web }}" >> "$GITHUB_OUTPUT"
          fi

  dispatch-api:
    name: Dispatch API deploy
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch → accountgo-ops (deploy-api)
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "OPS_DISPATCH_TOKEN is not set. Hosted deploy cannot be notified." >&2
            echo "See private repo AccountGo/accountgo-ops docs/SECRETS-SETUP.md" >&2
            exit 1
          fi
          gh api repos/AccountGo/accountgo-ops/dispatches \
            -f event_type='deploy-api' \
            -f "client_payload[sha]=${{ github.sha }}" \
            -f "client_payload[component]=api"

  dispatch-web:
    name: Dispatch Web deploy
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch → accountgo-ops (deploy-web)
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "OPS_DISPATCH_TOKEN is not set. Hosted deploy cannot be notified." >&2
            echo "See private repo AccountGo/accountgo-ops docs/SECRETS-SETUP.md" >&2
            exit 1
          fi
          gh api repos/AccountGo/accountgo-ops/dispatches \
            -f event_type='deploy-web' \
            -f "client_payload[sha]=${{ github.sha }}" \
            -f "client_payload[component]=web"
