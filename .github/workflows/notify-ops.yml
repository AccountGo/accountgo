name: Notify ops to deploy

# Manual only. Hosted production deploy runs in private AccountGo/accountgo-ops.
# Requires repo secret OPS_DISPATCH_TOKEN (see accountgo-ops docs/GH-SECRETS.md).
# Prefer deploying directly from accountgo-ops with a main SHA if the dispatch token is unset.

on:
  workflow_dispatch:
    inputs:
      component:
        description: Which component to deploy (api, web, or both)
        required: true
        default: both
        type: choice
        options:
          - both
          - api
          - web
      sha:
        description: Optional product git SHA to deploy (default = this workflow run's commit / current main tip when run from Actions UI on main)
        required: false
        type: string

concurrency:
  group: notify-ops-${{ inputs.sha || github.sha }}
  cancel-in-progress: false

jobs:
  resolve:
    name: Resolve targets
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.out.outputs.api }}
      web: ${{ steps.out.outputs.web }}
      sha: ${{ steps.out.outputs.sha }}
    steps:
      - name: Set outputs
        id: out
        run: |
          c="${{ inputs.component }}"
          if [ "$c" = "api" ] || [ "$c" = "both" ]; then echo "api=true" >> "$GITHUB_OUTPUT"; else echo "api=false" >> "$GITHUB_OUTPUT"; fi
          if [ "$c" = "web" ] || [ "$c" = "both" ]; then echo "web=true" >> "$GITHUB_OUTPUT"; else echo "web=false" >> "$GITHUB_OUTPUT"; fi
          SHA="${{ inputs.sha }}"
          if [ -z "$SHA" ]; then SHA="${{ github.sha }}"; fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Deploying component=$c sha=$SHA"

  dispatch-api:
    name: Dispatch API deploy
    needs: resolve
    if: needs.resolve.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch → accountgo-ops (deploy-api)
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "OPS_DISPATCH_TOKEN is not set. Deploy manually from AccountGo/accountgo-ops instead:" >&2
            echo "  gh workflow run deploy-api.yml -R AccountGo/accountgo-ops -f sha=${{ needs.resolve.outputs.sha }}" >&2
            exit 1
          fi
          gh api repos/AccountGo/accountgo-ops/dispatches \
            -f event_type='deploy-api' \
            -f "client_payload[sha]=${{ needs.resolve.outputs.sha }}" \
            -f "client_payload[component]=api"

  dispatch-web:
    name: Dispatch Web deploy
    needs: resolve
    if: needs.resolve.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: repository_dispatch → accountgo-ops (deploy-web)
        env:
          GH_TOKEN: ${{ secrets.OPS_DISPATCH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "OPS_DISPATCH_TOKEN is not set. Deploy manually from AccountGo/accountgo-ops instead:" >&2
            echo "  gh workflow run deploy-web.yml -R AccountGo/accountgo-ops -f sha=${{ needs.resolve.outputs.sha }}" >&2
            exit 1
          fi
          gh api repos/AccountGo/accountgo-ops/dispatches \
            -f event_type='deploy-web' \
            -f "client_payload[sha]=${{ needs.resolve.outputs.sha }}" \
            -f "client_payload[component]=web"
